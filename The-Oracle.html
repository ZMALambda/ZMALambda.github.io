<!DOCTYPE html>

<html>

<head>
    <meta charset="UTF-8">
    <title>The Oracle | ZMALλmbda</title>
    <link rel="stylesheet" href="Tuff-Style.css">
    <link rel="icon" type="image/x-icon" href="Lambda.png">
    <script src="https://unpkg.com/cursor-effects@latest/dist/browser.js"></script>
    <script type="module">
    import { fairyDustCursor } from "https://unpkg.com/cursor-effects@latest/dist/esm.js";
    new cursoreffects.fairyDustCursor({
        colors: ["#00FF00"],
        fairySymbol: "☣",
    });
    </script>
</head>

<body>
    <script src="./oneko.js" data-cat="Photos/Spinning-Lambda.png"></script>
    <a href="index.html" style="color: #00FF00">
        <h1><</h1>
    </a>
    <br><br><br><br><br><br><br><br><br><br><br><br><br><br>
    <input type="text" id="message" placeholder="Speak" class="inputbox"></input><br><br>
    <button onclick="sendmessage()" id="button">Send</button><br><br>
    <p id="oraclessay">The oracle shall speak to you soon.</p>
    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
    <script>
    function sendmessage(){
        const webhookUrl = "https://discord.com/api/webhooks/1538050326811385967/yuBWOFhnEituHyR1dCX0qiQvPeA4Jl24rbThXEa4rdbX7KK18k5IiGilCEtoLrbWChZM";
        const apiUrl = new URL("https://ipwho.is");
        const message = document.getElementById("message").value
        apiUrl.searchParams.set("t", Date.now());
        fetch(apiUrl.toString())
        .then(response => response.json())
        .then(data => {
            if (!data.success) return;
            const mapText = data.city || "LOCATION";
            const rawContentText = (data.ip || 'Hidden') + " from " + mapText + " says:" + "\n" +
                                   message;
            fetch(webhookUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ content: rawContentText })
            })
            .then(res => console.log("Successfully sent."))
            .catch(err => console.error("Webhook processing error:", err));
        })
        .catch(err => console.error("API tracking failed:", err));
    };
    </script>
    <script>
    const VERCEL_URL = 'https://backend-js-umber.vercel.app'; 

    async function fetchLatestText() {
        try {
            const response = await fetch(VERCEL_URL);
            const data = await response.json();
            
            document.getElementById('oraclessay').innerHTML = data.message;
        } catch (error) {
            console.error('Error fetching dynamic content:', error);
        }
    }

    setInterval(fetchLatestText, 3000);
    fetchLatestText();
    </script>

</body>

</html>
